# nginx in front of rpi-provisioner-ui, for reaching it from other machines.
#
# nginx only carries the traffic over HTTPS. Operators sign in on the web
# interface itself, with an account in the rpi-sb-provisioner group, and
# scripts use API tokens; see docs/api/authentication.md.
#
# Replace provisioner.example.com with the name people will use, and give
# the web interface the same name (see README.md in this directory).

server {
    listen 80;
    listen [::]:80;
    server_name provisioner.example.com;

    # Never serve the interface over plain HTTP: passwords and session
    # cookies would cross the network unencrypted.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name provisioner.example.com;

    ssl_certificate     /etc/ssl/certs/provisioner.example.com.crt;
    ssl_certificate_key /etc/ssl/private/provisioner.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/rpi-provisioner-ui.access.log;
    error_log  /var/log/nginx/rpi-provisioner-ui.error.log;

    # OS images are uploaded through the interface and can be several GB.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        # The web interface listens on loopback only; nginx is its one
        # network-facing client.
        proxy_pass http://127.0.0.1:3142;

        # The interface refuses requests for names it was not given, so
        # pass the name the browser used.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Lets the interface mark its cookies Secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live device and progress updates use WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
